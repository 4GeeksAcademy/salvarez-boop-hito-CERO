    var currentLang = 'es';

    function applyLanguage(lang) {
      currentLang = lang;
      document.documentElement.setAttribute('lang', lang === 'es' ? 'es' : 'en');
      document.documentElement.setAttribute('data-lang', lang);

      var elements = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < elements.length; i++) {
        var el = elements[i];
        var key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      }

      // Actualizar botones de toggle
      var toggleDesktop = document.getElementById('langToggle');
      var toggleMobile = document.getElementById('langToggleMobile');
      if (lang === 'es') {
        toggleDesktop.textContent = 'EN';
        toggleDesktop.setAttribute('aria-label', 'Cambiar idioma a inglés');
        toggleMobile.textContent = 'English';
        toggleMobile.setAttribute('aria-label', 'Cambiar idioma a inglés');
      } else {
        toggleDesktop.textContent = 'ES';
        toggleDesktop.setAttribute('aria-label', 'Cambiar idioma a español');
        toggleMobile.textContent = 'Español';
        toggleMobile.setAttribute('aria-label', 'Cambiar idioma a español');
      }
    }

    // ---- Carga de componentes ----
    function loadComponent(id, url) {
      fetch(url)
        .then(function(r) { return r.text(); })
        .then(function(html) {
          document.getElementById(id).innerHTML = html;
          // Después de inyectar, re-aplicar idioma actual
          applyLanguage(currentLang);
        })
        .catch(function(err) {
          console.error('Error cargando ' + url + ':', err);
        });
    }

    // ---- Event delegation para botones toggle (funciona aunque se inyecten después) ----
    document.addEventListener('click', function(e) {
      var target = e.target;
      if (target.id === 'langToggle' || target.id === 'langToggleMobile') {
        applyLanguage(currentLang === 'es' ? 'en' : 'es');
      }
      // Menú hamburguesa
      if (target.id === 'menuToggle') {
        var menu = document.getElementById('mobileMenu');
        if (menu) {
          var expanded = target.getAttribute('aria-expanded') === 'true';
          target.setAttribute('aria-expanded', String(!expanded));
          menu.classList.toggle('hidden');
        }
      }
      // Cerrar menú al hacer clic en enlaces
      if (target.closest && target.closest('#mobileMenu a')) {
        var menuToggle = document.getElementById('menuToggle');
        var mobileMenu = document.getElementById('mobileMenu');
        if (mobileMenu) mobileMenu.classList.add('hidden');
        if (menuToggle) menuToggle.setAttribute('aria-expanded', 'false');
      }
    });

    loadComponent('navbar-container', 'components/navbar.html');
    loadComponent('hero-container', 'components/hero.html');
    loadComponent('about-container', 'components/about.html');
    loadComponent('footer-container', 'components/footer.html');
