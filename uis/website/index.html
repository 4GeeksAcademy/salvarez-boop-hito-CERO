<!DOCTYPE html>
<html lang="es" data-lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackFlow — Velocidad con Destino</title>
  <meta name="description" content="TrackFlow: gestión de almacenes, entregas de última milla y logística inversa en Estados Unidos y España. Más de 15 años optimizando la logística de e-commerce.">
  <meta name="keywords" content="logística, almacenes, última milla, e-commerce, TrackFlow, envíos, Los Ángeles, Zaragoza">
  <meta name="author" content="TrackFlow">
  <meta name="robots" content="index, follow">

  <!-- Open Graph -->
  <meta property="og:title" content="TrackFlow — Logística que escala con tu e-commerce">
  <meta property="og:description" content="Gestión de almacenes, entregas de última milla y logística inversa en Estados Unidos y España.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://trackflow.com">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="TrackFlow">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TrackFlow — Logística que escala con tu e-commerce">
  <meta name="twitter:description" content="Gestión de almacenes, entregas de última milla y logística inversa en Estados Unidos y España.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="apple-touch-icon" href="assets/img/favicon.svg">

  <!-- Schema.org JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "TrackFlow",
    "description": "Gestión de almacenes y entregas de última milla para e-commerce",
    "url": "https://trackflow.com",
    "foundingDate": "2009",
    "slogan": "Conectamos Rutas, Optimizamos Movimiento.",
    "address": [
      {
        "@type": "PostalAddress",
        "addressCountry": "US",
        "addressLocality": "Los Ángeles",
        "addressRegion": "California"
      },
      {
        "@type": "PostalAddress",
        "addressCountry": "ES",
        "addressLocality": "Zaragoza",
        "addressRegion": "Aragón"
      }
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+1-213-555-0147",
      "contactType": "sales",
      "availableLanguage": ["Spanish", "English"]
    },
    "sameAs": ["https://linkedin.com/company/trackflow"],
    "areaServed": [
      { "@type": "Country", "name": "Estados Unidos" },
      { "@type": "Country", "name": "Spain" }
    ]
  }
  </script>

  <!-- Tailwind CSS v4 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="font-sans text-[#1B2A4A] bg-white">

  <!-- ============================================================ -->
  <!-- NAVBAR (cargado desde components/navbar.html)                -->
  <!-- ============================================================ -->
  <div id="navbar-container"></div>

  <!-- ============================================================ -->
  <!-- COMPONENT LOADER                                             -->
  <!-- ============================================================ -->
  <script>
    function loadComponent(id, url) {
      fetch(url)
        .then(function(r) { return r.text(); })
        .then(function(html) {
          document.getElementById(id).innerHTML = html;
        })
        .catch(function(err) {
          console.error('Error cargando ' + url + ':', err);
        });
    }

    loadComponent('navbar-container', 'components/navbar.html');
  </script>
</body>
</html>
