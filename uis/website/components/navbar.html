<!-- ============================================================ -->
<!-- HEADER / NAVBAR                                              -->
<!-- ============================================================ -->
<header class="fixed top-0 left-0 w-full bg-[#002868] shadow-lg z-50" role="banner">
  <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6">
    <div class="flex items-center justify-between h-20 sm:h-24 lg:h-28">

      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2 sm:gap-3 group" aria-label="TrackFlow inicio">
        <img
          src="assets/img/pin-trackflow.svg"
          alt="TrackFlow, logística que escala"
          class="h-16 w-auto sm:h-20 lg:h-24 transition-transform duration-300 group-hover:scale-105"
        >
        <div class="flex flex-col leading-tight">
          <span class="text-white font-bold text-xl sm:text-2xl lg:text-3xl tracking-wide">TrackFlow</span>
          <span class="text-[8px] sm:text-[10px] lg:text-xs font-black tracking-[0.2em]">
            <span class="bg-gradient-to-b from-[#FFE44D] to-[#FFC400] bg-clip-text text-transparent">VELOCI</span><span class="bg-gradient-to-b from-[#FFB347] to-[#FF8F00] bg-clip-text text-transparent">DAD</span>
            <span class="bg-gradient-to-b from-[#FF4444] to-[#C60B1E] bg-clip-text text-transparent">CON</span>
            <span class="bg-gradient-to-b from-[#FFE44D] to-[#FFC400] bg-clip-text text-transparent">DES</span><span class="bg-gradient-to-b from-[#FFB347] to-[#FF8F00] bg-clip-text text-transparent">TI</span><span class="bg-gradient-to-b from-[#FF4444] to-[#C60B1E] bg-clip-text text-transparent">NO</span>
          </span>
        </div>
      </a>

      <!-- Navegación escritorio -->
      <nav class="hidden md:flex items-center gap-8" aria-label="Navegación principal">
        <a
          href="#"
          class="text-white/90 hover:text-[#FFC400] transition-colors duration-200 text-sm lg:text-base font-medium"
          data-i18n="nav.home"
          aria-current="page"
        >Inicio</a>
        <a
          href="#servicios"
          class="text-white/90 hover:text-[#FFC400] transition-colors duration-200 text-sm lg:text-base font-medium"
          data-i18n="nav.services"
        >Servicios</a>
        <a
          href="#cobertura"
          class="text-white/90 hover:text-[#FFC400] transition-colors duration-200 text-sm lg:text-base font-medium"
          data-i18n="nav.coverage"
        >Cobertura</a>
        <a
          href="#contacto"
          class="text-white/90 hover:text-[#FFC400] transition-colors duration-200 text-sm lg:text-base font-medium"
          data-i18n="nav.contact"
        >Contacto</a>

        <!-- Toggle idioma -->
        <button
          id="langToggle"
          class="ml-4 px-3 py-1.5 rounded-full border border-white/30 text-white/90 text-xs font-semibold uppercase tracking-wider hover:bg-white/10 hover:border-[#FFC400] transition-all duration-200 cursor-pointer"
          aria-label="Cambiar idioma a inglés"
        >
          EN
        </button>
      </nav>

      <!-- Botón menú hamburguesa (mobile) -->
      <button
        id="menuToggle"
        class="md:hidden flex flex-col gap-1.5 p-2 cursor-pointer group"
        aria-label="Abrir menú de navegación"
        aria-expanded="false"
        aria-controls="mobileMenu"
      >
        <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300 group-[[aria-expanded=true]]:rotate-45 group-[[aria-expanded=true]]:translate-y-2"></span>
        <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300 group-[[aria-expanded=true]]:opacity-0"></span>
        <span class="block w-6 h-0.5 bg-white rounded transition-all duration-300 group-[[aria-expanded=true]]:-rotate-45 group-[[aria-expanded=true]]:-translate-y-2"></span>
      </button>
    </div>
  </div>

  <!-- Menú móvil -->
  <div
    id="mobileMenu"
    class="md:hidden hidden bg-[#002868] border-t border-white/10"
    role="navigation"
    aria-label="Navegación móvil"
  >
    <div class="px-4 py-4 space-y-3">
      <a
        href="#"
        class="block text-white/90 hover:text-[#FFC400] transition-colors duration-200 py-2 text-base font-medium"
        data-i18n="nav.home"
        aria-current="page"
      >Inicio</a>
      <a
        href="#servicios"
        class="block text-white/90 hover:text-[#FFC400] transition-colors duration-200 py-2 text-base font-medium"
        data-i18n="nav.services"
      >Servicios</a>
      <a
        href="#cobertura"
        class="block text-white/90 hover:text-[#FFC400] transition-colors duration-200 py-2 text-base font-medium"
        data-i18n="nav.coverage"
      >Cobertura</a>
      <a
        href="#contacto"
        class="block text-white/90 hover:text-[#FFC400] transition-colors duration-200 py-2 text-base font-medium"
        data-i18n="nav.contact"
      >Contacto</a>

      <!-- Toggle idioma mobile -->
      <button
        id="langToggleMobile"
        class="mt-2 px-4 py-2 rounded-full border border-white/30 text-white/90 text-sm font-semibold uppercase tracking-wider hover:bg-white/10 hover:border-[#FFC400] transition-all duration-200 w-full cursor-pointer"
        aria-label="Cambiar idioma a inglés"
      >
        English
      </button>
    </div>
  </div>
</header>

<!-- Espaciado para el header fijo -->
<div class="h-20 sm:h-24 lg:h-28"></div>

<!-- ============================================================ -->
<!-- SCRIPTS DEL NAVBAR                                           -->
<!-- ============================================================ -->
<script>
  // ---- Menú hamburguesa ----
  const menuToggle = document.getElementById('menuToggle');
  const mobileMenu = document.getElementById('mobileMenu');

  if (menuToggle && mobileMenu) {
    menuToggle.addEventListener('click', function() {
      const expanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', String(!expanded));
      mobileMenu.classList.toggle('hidden');
    });

    // ---- Cerrar menú al hacer clic en un enlace ----
    mobileMenu.querySelectorAll('a').forEach(function(link) {
      link.addEventListener('click', function() {
        mobileMenu.classList.add('hidden');
        menuToggle.setAttribute('aria-expanded', 'false');
      });
    });
  }

  // ---- Multiidioma ES/EN ----
  var translations = {
    es: {
      'nav.home': 'Inicio',
      'nav.services': 'Servicios',
      'nav.coverage': 'Cobertura',
      'nav.contact': 'Contacto'
    },
    en: {
      'nav.home': 'Home',
      'nav.services': 'Services',
      'nav.coverage': 'Coverage',
      'nav.contact': 'Contact'
    }
  };

  var currentLang = 'es';

  function applyLanguage(lang) {
    currentLang = lang;
    document.documentElement.setAttribute('lang', lang === 'es' ? 'es' : 'en');
    document.documentElement.setAttribute('data-lang', lang);

    var elements = document.querySelectorAll('[data-i18n]');
    for (var i = 0; i < elements.length; i++) {
      var el = elements[i];
      var key = el.getAttribute('data-i18n');
      if (translations[lang] && translations[lang][key]) {
        el.textContent = translations[lang][key];
      }
    }

    // Actualizar botones de toggle
    var toggleDesktop = document.getElementById('langToggle');
    var toggleMobile = document.getElementById('langToggleMobile');
    if (lang === 'es') {
      toggleDesktop.textContent = 'EN';
      toggleDesktop.setAttribute('aria-label', 'Cambiar idioma a inglés');
      toggleMobile.textContent = 'English';
      toggleMobile.setAttribute('aria-label', 'Cambiar idioma a inglés');
    } else {
      toggleDesktop.textContent = 'ES';
      toggleDesktop.setAttribute('aria-label', 'Cambiar idioma a español');
      toggleMobile.textContent = 'Español';
      toggleMobile.setAttribute('aria-label', 'Cambiar idioma a español');
    }
  }

  var langToggle = document.getElementById('langToggle');
  var langToggleMobile = document.getElementById('langToggleMobile');

  if (langToggle) {
    langToggle.addEventListener('click', function() {
      applyLanguage(currentLang === 'es' ? 'en' : 'es');
    });
  }
  if (langToggleMobile) {
    langToggleMobile.addEventListener('click', function() {
      applyLanguage(currentLang === 'es' ? 'en' : 'es');
    });
  }
</script>
